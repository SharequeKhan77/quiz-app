<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4 text-center">
    <div class="card p-5">
        <h1>{{ quiz.title }}</h1>
        <h2 class="mt-3">Your Score</h2>
        <h1 class="display-1 text-primary">{{ score }}/{{ total }}</h1>
        {% if score == total %}
        <p class="text-success">Perfect score! 🎉</p>
        {% elif score > total|divisibleby:2 %}
        <p class="text-warning">Good job! Keep practicing!</p>
        {% else %}
        <p class="text-danger">Keep practicing! You'll get better!</p>
        {% endif %}
        <a href="/" class="btn btn-primary mt-3">Back to Quizzes</a>
    </div>
</div>
</body>
</html>
